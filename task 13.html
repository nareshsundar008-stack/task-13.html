<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JS Conditionals & Loops Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        button {
            margin: 10px 0;
            padding: 10px 15px;
            cursor: pointer;
        }
        #output {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<h2>JavaScript Conditionals & Loops</h2>

<button onclick="checkNumber()">Check Even or Odd</button>
<button onclick="runLoop()">Print Numbers (1–10)</button>

<div id="output"></div>

<script>
    // Conditional Statement Example
    function checkNumber() {
        let num = prompt("Enter a number:");
        let result = "";

        if (num % 2 === 0) {
            result = num + " is Even";
        } else {
            result = num + " is Odd";
        }

        document.getElementById("output").innerHTML = result;
    }

    // Looping Construct Example
    function runLoop() {
        let result = "Numbers from 1 to 10:<br>";

        for (let i = 1; i <= 10; i++) {
            result += i + "<br>";
        }

        document.getElementById("output").innerHTML = result;
    }
</script>

</body>
</html>
